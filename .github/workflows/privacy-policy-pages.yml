name: Deploy site and privacy policy to Pages

on:
  push:
    branches:
      - develop
    paths:
      - docs/site/**
      - docs/privacy-policy/**
      - .github/workflows/privacy-policy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 소개 사이트는 루트에, 개인정보 처리방침은 기존 주소(/privacy-policy/)에 둔다.
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/privacy-policy
          cp -R docs/site/. _site/
          cp -R docs/privacy-policy/. _site/privacy-policy/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
