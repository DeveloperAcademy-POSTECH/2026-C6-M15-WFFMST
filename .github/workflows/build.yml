# PR은 develop과 합친 코드(refs/pull/N/merge)로, develop은 머지된 결과로 빌드를 검사한다.
name: Build

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# PR에 결과 댓글을 남기기 위한 권한
permissions:
  contents: read
  pull-requests: write

# 같은 PR에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package test · App build
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      SPM_DIR: ${{ github.workspace }}/.spm
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 버전
        run: xcodebuild -version

      - name: SPM 의존성 캐시
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Firebase가 필요 없는 CQBCoreTests만 돌린다. CQBFirebaseTests는 Firebase를 macOS용으로 한 번 더 컴파일해서 뺀다.
      - name: CQBCore 패키지 테스트
        id: test
        working-directory: CQB/Packages/CQBCore
        run: |
          xcodebuild test -quiet \
            -scheme CQBCoreTests \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath "$SPM_DIR"

      - name: MemberApp 빌드
        id: member
        run: |
          xcodebuild build -quiet \
            -project CQB/CQB.xcodeproj \
            -scheme MemberApp \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            CODE_SIGNING_ALLOWED=NO

      - name: InstructorApp 빌드
        id: instructor
        run: |
          xcodebuild build -quiet \
            -project CQB/CQB.xcodeproj \
            -scheme InstructorApp \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            CODE_SIGNING_ALLOWED=NO

      # 결과 댓글은 PR마다 하나만 두고, 다시 실행되면 내용을 고친다.
      - name: PR에 결과 댓글
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          TEST: ${{ steps.test.outcome }}
          MEMBER: ${{ steps.member.outcome }}
          INSTRUCTOR: ${{ steps.instructor.outcome }}
        with:
          script: |
            const marker = '<!-- build-check -->';
            const passed = [process.env.TEST, process.env.MEMBER, process.env.INSTRUCTOR]
              .every(outcome => outcome === 'success');
            // PR 작성자 login → 별호. 멘션하지 않고 별호만 쓴다.
            const titles = { '0sunset0': '산', 'LeeDayday': '림', 'yoonjung561': '풍' };
            const lines = {
              success: {
                산: ['산이 우뚝 섰군.', '오늘도 산은 흔들리지 않았어.', '제법 높은 산이 되었군.'],
                림: ['숲이 무성하군.', '오늘도 숲은 평화롭군.', '제법 울창해졌어.'],
                풍: ['바람이 순풍을 탔군.', '오늘은 바람이 제법 시원하군.', '풍향이 아주 좋군.'],
                default: ['강호가 조용하군.', '제법이군. 누군지는 모르겠지만.'],
              },
              failure: {
                산: ['산이 무너졌군.', '산사태가 났군. 복구는 직접 하게.', '태산도 빌드 앞에서는 무너지는군.'],
                림: ['숲이 불타고 있네.', '산불이 났군. 발화 원인은 자네야.', '숲이 황폐해졌군.'],
                풍: ['바람이 역풍이 되었군.', '바람이 방향을 잃었군.', '태풍인 줄 알았더니 미풍이었군.'],
                default: ['강호에 낯선 마가 끼었군.', '이름 모를 협객이 일을 냈군.'],
              },
            };
            const title = titles[context.payload.pull_request.user.login];
            const pool = lines[passed ? 'success' : 'failure'][title ?? 'default'];
            const line = pool[Math.floor(Math.random() * pool.length)];
            const body = [
              marker,
              passed ? '🌿 **빌드 성공. 중원은 평화롭다.**' : '🔥 **빌드 실패. 중원에 마가 끼었다.**',
              '',
              `**${title ?? '무명'} 소협**, ${line}`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
