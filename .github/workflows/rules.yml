# 보안 규칙(firebase/*.rules)을 Firebase 에뮬레이터에서 테스트한다.
# 규칙이나 규칙 테스트가 바뀐 PR에서만 돈다. 앱 빌드는 build.yml이 맡는다.
name: Rules

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'firebase/**'
      - 'firebase.json'
      - '.github/workflows/rules.yml'
  push:
    branches: [develop]
    paths:
      - 'firebase/**'
      - 'firebase.json'
      - '.github/workflows/rules.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: rules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Firestore·Storage 규칙 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Firebase 에뮬레이터는 Java 21 이상이 필요하다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/tests/package-lock.json

      - name: 에뮬레이터 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.33.0

      - name: 의존성 설치
        working-directory: firebase/tests
        run: |
          npm ci
          npm install -g firebase-tools@15.33.0

      # demo- 프로젝트 ID라 운영 Firebase에 연결하지 않는다.
      - name: 규칙 테스트
        id: test
        working-directory: firebase/tests
        run: npm run test:emulators

      # 결과 댓글은 PR마다 하나만 두고, 다시 실행되면 내용을 고친다.
      - name: PR에 결과 댓글
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          TEST: ${{ steps.test.outcome }}
        with:
          script: |
            const marker = '<!-- rules-check -->';
            const passed = process.env.TEST === 'success';
            const body = [
              marker,
              passed ? '✅ **보안 규칙 테스트 통과**' : '❌ **보안 규칙 테스트 실패**',
              '',
              passed
                ? 'Firestore·Storage 규칙이 테스트한 약속을 모두 지킵니다.'
                : '규칙이 약속을 어겼거나 테스트를 고쳐야 합니다. Actions 로그의 실패한 테스트 이름을 확인해 주세요.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
